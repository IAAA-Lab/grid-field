version: "3.9"

services:

  postgis:
    image: kartoza/postgis:16-3.4
    container_name: grid-field-postgis1634
    ports:
      - "25432:5432"
    volumes:
      - grid-field-dbdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: umer

volumes:
  grid-field-dbdata:
    name: grid-field-dbdata
